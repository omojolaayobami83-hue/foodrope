<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ColdDrop Vendor</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:15px}
.order{background:white;padding:12px;border-radius:12px;margin-bottom:10px;border-left:5px solid #E30613}
.top{display:flex;justify-content:space-between;font-weight:900}
button{padding:6px 10px;border:none;border-radius:8px;background:black;color:white;margin-top:8px}
</style>
</head>
<body>
<h2>🧊 ColdDrop Vendor Orders</h2>
<button onclick="load()">Refresh 🔄</button> 
<button onclick="clearAll()" style="background:red">Clear All</button>
<div id="list" style="margin-top:15px"></div>

<script>
function load(){
 let orders=JSON.parse(localStorage.getItem('colddrop_orders')||'[]');
 if(!orders.length){
  document.getElementById('list').innerHTML='<p style="padding:20px;text-align:center;color:#888">No orders yet.</p>';
  return;
 }
 document.getElementById('list').innerHTML=orders.map(o=>`
  <div class="order">
   <div class="top"><span>${o.name}</span><span>₦${o.total.toLocaleString()}</span></div>
   <small>${o.phone} - ${o.addr}</small><br><small>${o.time}</small>
   <div style="margin-top:8px;background:#f8f8f8;padding:8px;border-radius:8px">${o.items.map(x=>`• ${x.name} ₦${x.price}`).join('<br>')}<br><b>Total: ₦${o.total.toLocaleString()}</b></div>
   <div style="margin-top:8px"><button onclick="del(${o.id})">Mark Delivered ✅</button></div>
  </div>
 `).join('');
}
function del(id){
 let os=JSON.parse(localStorage.getItem('colddrop_orders')||'[]');
 os=os.filter(o=>o.id!==id);
 localStorage.setItem('colddrop_orders',JSON.stringify(os));
 load();
}
function clearAll(){
 if(confirm('Clear all?')){
  localStorage.removeItem('colddrop_orders');
  load();
 }
}
load(); setInterval(load,2000);
</script></body></html>
