<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ColdDrop Supermarket</title>
<meta name="theme-color" content="#E30613">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto}
body{background:#f8f8f8;padding-bottom:100px}
.header{background:#E30613;color:white;padding:14px 16px 18px;position:sticky;top:0;z-index:10}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px}
.search{margin-top:10px;background:white;border-radius:12px;display:flex;padding:10px 12px}
.search input{border:none;outline:none;width:100%;margin-left:8px;font-size:14px}
.badge{background:black;color:white;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;margin-top:6px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:white;position:sticky;top:65px;z-index:9}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;padding:8px 14px;border-radius:20px;background:#f0f0f0;font-size:12px;font-weight:700;border:1px solid #eee;cursor:pointer}
.cat.active{background:black;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:10px 12px}
.card{background:white;border-radius:18px;padding:8px;position:relative;border:1px solid #eee}
.img{height:80px;background:#faf5f5;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative}
.price{font-weight:900;font-size:12px;margin-top:6px}
.name{font-size:10px;color:#444;line-height:1.2;height:30px;overflow:hidden}
.add{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;background:white;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer}
.out{position:absolute;inset:0;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:9px;color:#E30613;border-radius:18px;text-align:center}
.cart{position:fixed;bottom:12px;left:12px;right:12px;background:#23140a;color:white;border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;z-index:20}
.btn{background:white;color:black;border:none;padding:11px 18px;border-radius:12px;font-weight:900}
.sec{padding:14px 16px 0;font-weight:900;font-size:14px}
</style>
</head>
<body>
<div class="header">
<div class="top"><div class="logo">❄️ ColdDrop</div><div style="font-size:12px">Lagos</div></div>
<div class="search">🔍 <input id="searchInput" placeholder="Search rice, chicken, soap..." oninput="doSearch()"></div>
<div style="margin-top:10px"><div class="badge">⚡ Delivered in 27 mins • Lagos</div><div style="font-size:26px;font-weight:900;line-height:1">Pay Less,<br><span style="color:#FFD400">Get More</span></div></div>
</div>
<div class="cats" id="cats"></div>
<div id="root"></div>
<div class="cart" id="cartBar" style="display:none"><div>🛒 <span id="cc">0</span> • ₦<span id="ct">0</span></div><button class="btn" onclick="checkout()">Checkout →</button></div>

<script>
let cats=["All","Foodstuffs","Tomatoes","Spices","Frozen Foods","Bakery","Snacks","Drinks","Oil","Soap","Toiletries","Baby"];
let catMap={"Foodstuffs":"Foodstuffs & Grains","Tomatoes":"Tomatoes & Peppers","Spices":"Spices & Seasonings","Frozen Foods":"Frozen Foods & Meats","Bakery":"Bakery","Snacks":"Snacks & Biscuits","Drinks":"Drinks & Beverages","Oil":"Cooking Oil","Soap":"Soap & Detergent","Toiletries":"Toiletries","Baby":"Baby & Household"};
let products=[
{id:1,name:"Rice 1kg",price:2000,cat:"Foodstuffs & Grains",emoji:"🍚",available:true},
{id:2,name:"Beans 1kg",price:1800,cat:"Foodstuffs & Grains",emoji:"🫘",available:true},
{id:3,name:"Garri Ijebu 1kg",price:1200,cat:"Foodstuffs & Grains",emoji:"🥣",available:true},
{id:4,name:"Yam Tuber Big",price:2500,cat:"Foodstuffs & Grains",emoji:"🍠",available:true},
{id:5,name:"Spaghetti 500g",price:900,cat:"Foodstuffs & Grains",emoji:"🍝",available:true},
{id:6,name:"Indomie 70g",price:300,cat:"Foodstuffs & Grains",emoji:"🍜",available:true},
{id:11,name:"Tomatoes 1kg",price:2000,cat:"Tomatoes & Peppers",emoji:"🍅",available:true},
{id:12,name:"Onions 1kg",price:1500,cat:"Tomatoes & Peppers",emoji:"🧅",available:true},
{id:21,name:"Full Chicken",price:6500,cat:"Frozen Foods & Meats",emoji:"🍗",available:true},
{id:22,name:"Chicken Laps 1kg",price:9050,cat:"Frozen Foods & Meats",emoji:"🍗",available:true},
{id:26,name:"Agege Bread",price:1200,cat:"Bakery",emoji:"🍞",available:true},
{id:30,name:"Pringles",price:2500,cat:"Snacks & Biscuits",emoji:"🥔",available:true},
{id:34,name:"Coca-Cola",price:400,cat:"Drinks & Beverages",emoji:"🥤",available:true},
{id:35,name:"Water 75cl",price:300,cat:"Drinks & Beverages",emoji:"💧",available:true},
{id:37,name:"Palm Oil 1L",price:1800,cat:"Cooking Oil",emoji:"🫙",available:true},
{id:39,name:"Sunlight 1kg",price:1500,cat:"Soap & Detergent",emoji:"🧼",available:true},
{id:41,name:"Closeup 145g",price:900,cat:"Toiletries",emoji:"🪥",available:true},
{id:43,name:"Pampers",price:3500,cat:"Baby & Household",emoji:"👶",available:true}
];

let active="All"; let cart=[]; let searchQ="";

function renderCats(){
 document.getElementById('cats').innerHTML=cats.map(c=>`<div class="cat ${c===active?'active':''}" onclick="setCat('${c}')">${c}</div>`).join('');
}
function setCat(c){active=c;render()}
function doSearch(){searchQ=document.getElementById('searchInput').value.toLowerCase();render()}

function render(){
 let html="";
 let catsToShow = active==="All" ? cats.slice(1) : [active];
 catsToShow.forEach(shortCat=>{
  let fullCat = catMap[shortCat] || shortCat;
  let displayItems = products.filter(p=>p.cat===fullCat && (searchQ==="" || p.name.toLowerCase().includes(searchQ)));
  if(!displayItems.length) return;
  html+=`<div class="sec">${fullCat}</div><div class="grid">`+displayItems.map(p=>`
   <div class="card">
    <div class="img">${p.emoji}${!p.available?`<div class="out">OUT OF STOCK</div>`:`<div class="add" onclick="add(${p.id})">+</div>`}</div>
    <div class="price">₦${p.price.toLocaleString()}</div>
    <div class="name">${p.name}</div>
   </div>`).join('')+`</div>`;
 });
 document.getElementById('root').innerHTML=html || '<div style="padding:20px;text-align:center;color:#888">No items found</div>';
}

function add(id){
 let p=products.find(x=>x.id===id);
 if(!p.available){alert('Out of stock');return;}
 cart.push(p); upd();
}
function upd(){
 if(!cart.length){document.getElementById('cartBar').style.display='none';return;}
 document.getElementById('cartBar').style.display='flex';
 document.getElementById('cc').innerText=cart.length;
 document.getElementById('ct').innerText=cart.reduce((s,x)=>s+x.price,0).toLocaleString();
}
function checkout(){
 if(!cart.length)return;
 let name=prompt('Customer Name?'); if(!name)return;
 let phone=prompt('Phone?'); if(!phone)return;
 let addr=prompt('Address?'); if(!addr)return;
 let total=cart.reduce((s,x)=>s+x.price,0);
 let order={name,phone,addr,items:[...cart],total,time:new Date().toLocaleString(),id:Date.now()};
 let orders=JSON.parse(localStorage.getItem('colddrop_orders')||'[]');
 orders.unshift(order);
 localStorage.setItem('colddrop_orders',JSON.stringify(orders));
 cart=[]; upd(); render();
 alert('Order sent! ✅ Check vendor app to see order');
}
renderCats();render();
</script>
</body>
</html>
